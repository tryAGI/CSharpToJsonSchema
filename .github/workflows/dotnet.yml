name: Publish
on:
  push:
    branches:
      - main
    tags:
      - v**

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build
          --configuration Release
          --no-restore
        
      - name: Test
        run: dotnet test
          --configuration Release
          --logger GitHubActions
          --no-build

      - name: Upload tested NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-Linux
          path: src/libs/**/*.nupkg
          if-no-files-found: error
          
      - name: Publish to NuGet
        run: dotnet nuget push
          src/libs/**/*.nupkg
          --skip-duplicate
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_KEY }}
  
  trim-check:
    name: Trimming Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install AutoSDK CLI
        run: dotnet tool install --global autosdk.cli --prerelease

      - name: Run trimming check
        run: autosdk trim src/libs/CSharpToJsonSchema/CSharpToJsonSchema.csproj

  auto-stable-release:
    needs: [publish, trim-check]
    if: github.ref == 'refs/heads/main'
    uses: tryAGI/workflows/.github/workflows/auto-stable-release.yml@main
    with:
      project-path: CSharpToJsonSchema.slnx
    secrets:
      nuget-key: ${{ secrets.NUGET_KEY }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        run: gh release create ${{ github.ref_name }}
          --title "${{ github.ref_name }}"
          --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
